[workspace]
members = ["crates/state-audit", "crates/terminal"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/codeasy-digix/codexm"
publish = false

[workspace.dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
nix = { version = "0.31", features = ["signal", "process"] }
getrandom = "0.3"
signal-hook = "0.3"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
