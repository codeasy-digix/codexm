name: Test CodexM

on:
  push:
    branches: [main, "handoff/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install terminal and ownership tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux lsof
      - name: Ensure tmux on macOS
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Prepare pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Exercise native TUI in an isolated terminal
        run: |
          command -v node
          binary=$(./build.sh)
          CODEXM_TUI_TEST_BINARY="$binary" go test ./internal/cli -run '^TestNativeTUIThroughOwnedTerminal$' -count=1 -v

  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build shared backend and test desktop in isolation
        run: |
          go build -trimpath -o "$RUNNER_TEMP/codexm" ./cmd/codexm
          cd apps/macos
          CODEXM_TEST_BINARY="$RUNNER_TEMP/codexm" swift test

# Release upload remains a separate, explicit privacy-reviewed operation.
