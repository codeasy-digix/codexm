# Compact codexm. Official Codex owns model/effort/approval and chat execution.
[runtime]
shared_codex_home = "~/.codex"
accounts_dir = "~/.codex-accounts"
# codex_binary = "/absolute/path/to/official/codex" # optional; installed CLI by default
# web_node_binary = "/absolute/path/to/node24"     # optional web only

[storage]
state_dir = "~/.local/state/codexm"

[account_registry]
removed = [] # hidden registrations; authentication remains in accounts_dir
