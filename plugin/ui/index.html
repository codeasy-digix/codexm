<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>codexm</title><style>/* CODEXM_CSS */</style></head>
<body>
  <header class="top"><div><strong>codexm<span class="dot">●</span></strong><span class="subtitle">계정과 작업</span></div><span id="connection" role="status">연결 중</span></header>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="offline" hidden></div>
  <div id="app" hidden>
    <nav aria-label="관리 메뉴"><button data-tab="tasks" class="active">작업</button><button data-tab="accounts">계정</button><button data-tab="logs">사용 기록</button><button data-tab="settings">설정</button><button id="new-button" class="primary">+ 새 작업</button></nav>
    <section id="accounts-strip" aria-label="계정별 남은 한도"></section>
    <section id="tasks" class="workspace">
      <aside id="sidebar"><label class="sr" for="search">대화 검색</label><input id="search" type="search" placeholder="제목, 폴더, 계정 검색"><div class="filters"><select id="state-filter" aria-label="상태 필터"><option value="all">모든 대화</option><option value="managed">관리 중</option><option value="running">실행 중</option><option value="attention">확인 필요</option><option value="starred">즐겨찾기</option></select><select id="project-filter" aria-label="프로젝트 필터"><option value="">모든 프로젝트</option></select></div><div id="session-count" class="hint"></div><div id="sessions" role="listbox" aria-label="Codex 대화"></div></aside>
      <main id="task-main"><div id="task-header"></div><div id="task-controls"></div><div id="task-alerts"></div><div id="conversation" role="log" aria-label="선택한 대화"></div><div id="requests"></div><form id="composer"><label id="input-target" for="message">작업을 선택하세요</label><textarea id="message" rows="3" placeholder="추가 지시를 입력하세요. Enter 전송 · Shift+Enter 줄바꿈" disabled></textarea><div class="composer-actions"><button id="history-button" type="button">입력 기록</button><label><input type="checkbox" id="steer"> 진행 중인 턴에 바로 전달</label><button id="send-button" class="primary" disabled>지시 보내기</button></div></form></main>
    </section>
    <section id="accounts" class="page" hidden></section><section id="logs" class="page" hidden></section><section id="settings" class="page" hidden></section>
  </div>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <footer><span>로컬 관리 · 자동 감시는 모델 호출 없음</span><span id="observed"></span></footer>
  <script type="module">/* CODEXM_JS */</script>
</body></html>
